<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ramesh Carpenter</title>
<meta name="description" content="Ramesh Carpenter — custom furniture, doors, woodwork and repairs.">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');
:root{
  --glass:rgba(255,255,255,.14);
  --glass-strong:rgba(255,255,255,.22);
  --edge:rgba(255,255,255,.38);
  --text:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1623a2}
body{font-family:"DM Sans",system-ui,sans-serif;color:var(--text)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:3px}
svg{display:block;fill:currentColor}

/* Poster only. No overlay. */
.stage{position:fixed;inset:0;background:#1623a2 url("ramesh-carpenter-poster.png") center/cover no-repeat}

.glass{
  background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.08));
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--edge);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 -1px 0 rgba(255,255,255,.08) inset,0 24px 50px rgba(5,10,80,.35);
}

/* Player */
.player{position:absolute;z-index:6;left:50%;bottom:26px;transform:translateX(-50%);
  width:min(660px,calc(100% - 24px));display:flex;align-items:center;gap:14px;padding:10px 18px 10px 10px;border-radius:999px}
.cover{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
  font:700 19px "DM Sans",sans-serif;background:var(--glass-strong);border:1px solid var(--edge);
  box-shadow:0 1px 0 rgba(255,255,255,.45) inset}
.meta{flex:1;min-width:0}
.meta b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta>span{display:block;font-size:12px;opacity:.72;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seek{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:11px;font-variant-numeric:tabular-nums}
.seek span{opacity:.75;white-space:nowrap}

input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:14px;background:none;margin:0;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:9px;background:linear-gradient(90deg,#fff var(--p),rgba(255,255,255,.28) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:9px;background:rgba(255,255,255,.28)}
input[type=range]::-moz-range-progress{height:4px;border-radius:9px;background:#fff}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 8px rgba(255,255,255,.7)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:0}

.ctrl{display:flex;align-items:center;gap:4px;flex:none}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transition:background .15s}
.ib:hover,.ib[aria-expanded=true]{background:var(--glass-strong)}
.ib svg{width:19px;height:19px}
.play{width:54px;height:54px;border-radius:50%;margin:0 4px;display:grid;place-items:center;color:#10197a;
  background:rgba(255,255,255,.92);box-shadow:0 8px 24px rgba(5,10,80,.35);transition:transform .15s}
.play:hover{transform:scale(1.06)}
.play svg{width:23px;height:23px}
.play .pa{display:none}
.is-playing .play .pl{display:none}
.is-playing .play .pa{display:block}

/* Playlist */
.list{position:absolute;z-index:7;left:50%;bottom:100px;transform:translate(-50%,14px);opacity:0;pointer-events:none;
  width:min(660px,calc(100% - 24px));max-height:52vh;overflow:auto;padding:10px;border-radius:28px;
  transition:opacity .2s,transform .2s}
.list.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.row{width:100%;display:flex;align-items:center;gap:14px;padding:9px 14px 9px 9px;border-radius:18px;text-align:left;transition:background .15s}
.row:hover{background:rgba(255,255,255,.12)}
.row.on{background:var(--glass-strong);box-shadow:0 0 0 1px var(--edge) inset}
.row .cover{width:40px;height:40px;font-size:14px}
.row div{flex:1;min-width:0}
.row b{display:block;font-size:15px}
.row span{display:block;font-size:12px;opacity:.72;margin-top:2px}
.row em{font-style:normal;font-size:12px;opacity:.72;font-variant-numeric:tabular-nums}
.call{display:flex;gap:8px;padding:8px 4px 2px}
.call a{flex:1;text-align:center;padding:12px;border-radius:16px;font-weight:700;font-size:14px;text-decoration:none;
  background:rgba(255,255,255,.92);color:#10197a}
.call a.alt{background:var(--glass-strong);color:#fff;box-shadow:0 0 0 1px var(--edge) inset}

@media(max-width:600px){
  .player{bottom:14px;gap:10px;padding-right:12px}.cover{width:46px;height:46px}.play{width:48px;height:48px}
  .ctrl .skip{display:none}.list{bottom:88px}.seek span{font-size:10px}
}
@media(prefers-reduced-motion:reduce){.list,.play{transition:none}}
#yt{position:fixed;left:-9999px;bottom:0;width:200px;height:200px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="yt"></div>
<div class="stage" id="stage">

  <div class="list glass" id="list" role="region" aria-label="Playlist">
    <div id="rows"></div>
    <div class="call">
      <a href="tel:+919999999999">Call Ramesh</a>
      <a class="alt" href="https://wa.me/919999999999" target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </div>

  <div class="player glass">
    <div class="cover" id="cover" aria-hidden="true"></div>
    <div class="meta">
      <b id="tTitle"></b>
      <span id="tSub"></span>
      <div class="seek">
        <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
        <span id="time">0:00 / 0:00</span>
      </div>
    </div>
    <div class="ctrl">
      <button class="ib skip" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
      <button class="play" id="play" aria-label="Play">
        <svg class="pl" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="pa" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <button class="ib skip" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button>
      <button class="ib" id="toggle" aria-label="Open playlist" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zM4 11h16v2H4zM4 16h10v2H4z"/></svg></button>
    </div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
/* Playlist is loaded from embed.json (same folder as this page).
   Format: {"songs":[{"name":"Song title","id":"YouTubeVideoID"}, ...]} */
let SONGS=[],apiReady=false;

const $=id=>document.getElementById(id);
const fmt=n=>{n=Math.max(0,n||0);return Math.floor(n/60)+":"+String(Math.floor(n%60)).padStart(2,"0")};
let yt=null,ready=false,i=0,playing=false,timer=null,dragging=false;

function renderRows(){
  $("rows").innerHTML=SONGS.map((k,n)=>
   `<button class="row" data-n="${n}"><span class="cover">${n+1}</span>
    <div><b>${k.t||"Track "+(n+1)}</b><span>${k.a||"Ramesh Carpenter"}</span></div><em></em></button>`).join("");
  document.querySelectorAll(".row").forEach((r,x)=>r.classList.toggle("on",x===i));
}
function setMeta(){
  const k=SONGS[i]||{t:"Loading…",a:""};
  $("cover").textContent=i+1;
  $("tTitle").textContent=k.t||"Track "+(i+1);
  $("tSub").textContent=k.a||"Ramesh Carpenter";
  document.querySelectorAll(".row").forEach((r,x)=>r.classList.toggle("on",x===i));
}
function load(n,auto){
  i=(n+SONGS.length)%SONGS.length; setMeta(); draw(0,0);
  if(!ready)return;
  auto?yt.loadVideoById(SONGS[i].id):yt.cueVideoById(SONGS[i].id);
}
function draw(pos,d){
  const p=d?pos/d*100:0;
  $("seek").value=p; $("seek").style.setProperty("--p",p+"%");
  $("time").textContent=fmt(pos)+" / "+fmt(d);
}
function tick(){
  if(!ready||dragging)return;
  draw(yt.getCurrentTime(),yt.getDuration());
}
function setPlaying(p){
  playing=p; $("stage").classList.toggle("is-playing",p);
  $("play").setAttribute("aria-label",p?"Pause":"Play");
  clearInterval(timer); if(p)timer=setInterval(tick,500);
}
function syncTitle(){
  const v=yt.getVideoData&&yt.getVideoData();
  if(v&&v.title&&!SONGS[i].t){
    SONGS[i].t=v.title; if(v.author&&!SONGS[i].a)SONGS[i].a=v.author;
    const r=document.querySelectorAll(".row")[i];
    if(r){r.querySelector("b").textContent=SONGS[i].t;r.querySelector("div span").textContent=SONGS[i].a}
    setMeta();
  }
  const d=yt.getDuration(); const r=document.querySelectorAll(".row em")[i];
  if(r&&d)r.textContent=fmt(d);
}

function onYouTubeIframeAPIReady(){apiReady=true;boot()}
function boot(){
  if(!apiReady||!SONGS.length||yt)return;
  yt=new YT.Player("yt",{
    width:"200",height:"200",videoId:SONGS[0].id,
    playerVars:{playsinline:1,controls:0,rel:0,disablekb:1},
    events:{
      onReady:()=>{ready=true;load(0,false)},
      onStateChange:e=>{
        const S=YT.PlayerState;
        if(e.data===S.PLAYING){setPlaying(true);syncTitle()}
        else if(e.data===S.PAUSED)setPlaying(false);
        else if(e.data===S.ENDED)load(i+1,true);
      },
      onError:()=>load(i+1,true) // unavailable / non-embeddable video: skip it
    }
  });
}

$("play").onclick=()=>{if(!ready)return; playing?yt.pauseVideo():yt.playVideo()};
$("next").onclick=()=>load(i+1,playing);
$("prev").onclick=()=>{ if(ready&&yt.getCurrentTime()>3){yt.seekTo(0,true)} else load(i-1,playing) };
$("seek").oninput=e=>{dragging=true;const d=ready?yt.getDuration():0;draw(e.target.value/100*d,d)};
$("seek").onchange=e=>{ if(ready)yt.seekTo(e.target.value/100*yt.getDuration(),true); dragging=false };
$("rows").onclick=e=>{const r=e.target.closest(".row"); if(r)load(+r.dataset.n,true)};
$("toggle").onclick=()=>{const o=$("list").classList.toggle("open");$("toggle").setAttribute("aria-expanded",o)};
setMeta(); draw(0,0);
fetch("embed.json",{cache:"no-store"})
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
  .then(d=>{
    SONGS=(d.songs||[]).filter(s=>s&&s.id).map(s=>({id:s.id,t:s.name||"",a:s.artist||""}));
    if(!SONGS.length)throw new Error("empty");
    renderRows(); setMeta(); boot();
  })
  .catch(()=>{$("tTitle").textContent="Couldn't load embed.json";$("tSub").textContent="Check the file is next to index.html and valid JSON"});
</script>
</body>
</html>
